<!doctype html>
<html lang="en" data-palette="matcha">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Offline flashcards and practice questions, one chapter at a time.">
  <title>Quizzer — your chapter-by-chapter study space</title>
  <script>
    (() => {
      const params = new URLSearchParams(window.location.search);
      const param = params.get("scoutTheme");
      const theme = param === "light" || param === "dark"
        ? param : (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
      document.documentElement.dataset.palette = "matcha";
    })();
  </script>
  <style>
    :root {
      color-scheme: light;
      --cp-bg: #f7f4ef;
      --cp-bg-elevated: #fcfbf8;
      --cp-surface: #ffffff;
      --cp-surface-soft: #f5f5f5;
      --cp-border: #dedede;
      --cp-border-strong: #919191;
      --cp-text: #242424;
      --cp-text-muted: #5c5c5c;
      --cp-text-soft: #6f6f6f;
      --cp-accent: #b11f4b;
      --cp-accent-hover: #9a1a41;
      --cp-accent-soft: rgba(177, 31, 75, 0.08);
      --cp-accent-fg: #ffffff;
      --cp-success: #16a34a;
      --cp-danger: #dc2626;
      --cp-warning: #f59e0b;
      --cp-link: #0078d4;
      --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.12);
      --cp-overlay: rgba(255, 255, 255, 0.8);
      --cp-panel: rgba(255, 255, 255, 0.86);
      --cp-panel-strong: rgba(255, 255, 255, 0.96);
      --cp-sheen: rgba(255, 255, 255, 0.55);
      --cp-highlight: rgba(177, 31, 75, 0.12);
    }
    html[data-theme="dark"] {
      color-scheme: dark;
      --cp-bg: #3d3b3a;
      --cp-bg-elevated: #343231;
      --cp-surface: #292929;
      --cp-surface-soft: #2e2e2e;
      --cp-border: #474747;
      --cp-border-strong: #5f5f5f;
      --cp-text: #dedede;
      --cp-text-muted: #919191;
      --cp-text-soft: #b0b0b0;
      --cp-accent: #fd8ea1;
      --cp-accent-hover: #fb7b91;
      --cp-accent-soft: rgba(253, 142, 161, 0.14);
      --cp-accent-fg: #1a1a1a;
      --cp-success: #4ade80;
      --cp-danger: #f87171;
      --cp-warning: #fbbf24;
      --cp-link: #4da6ff;
      --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.32);
      --cp-overlay: rgba(41, 41, 41, 0.88);
      --cp-panel: rgba(41, 41, 41, 0.72);
      --cp-panel-strong: rgba(41, 41, 41, 0.96);
      --cp-sheen: rgba(255, 255, 255, 0.04);
      --cp-highlight: rgba(253, 142, 161, 0.12);
    }
    html[data-palette="matcha"] {
      --cp-bg: #f0f0e6;
      --cp-bg-elevated: #e7eadd;
      --cp-surface: #fafbf4;
      --cp-surface-soft: #e8ecdf;
      --cp-border: #d2d9c7;
      --cp-border-strong: #8a987d;
      --cp-text: #203426;
      --cp-text-muted: #52634d;
      --cp-text-soft: #5e6e58;
      --cp-accent: #315b36;
      --cp-accent-hover: #24482b;
      --cp-accent-soft: #e0e9cc;
      --cp-accent-fg: #f9fced;
      --cp-secondary: #80552a;
      --cp-secondary-soft: #f2e6cb;
      --cp-feature-bg: #243c2b;
      --cp-feature-surface: #324f36;
      --cp-feature-border: #577052;
      --cp-feature-text: #f2f5dd;
      --cp-feature-muted: #c2ceb4;
      --cp-feature-accent: #d7ef89;
      --cp-feature-accent-hover: #e5f6ad;
      --cp-feature-accent-fg: #263c21;
      --cp-feature-soft: #3b542b;
      --cp-highlight: rgba(49, 91, 54, 0.15);
      --cp-shadow: 0 18px 48px rgba(25, 45, 27, 0.18);
      --cp-overlay: rgba(27, 43, 30, 0.58);
      --cp-sheen: rgba(242, 245, 221, 0.3);
      --cp-danger: #b33227;
    }
    html[data-palette="matcha"][data-theme="dark"] {
      --cp-bg: #131e18;
      --cp-bg-elevated: #19271e;
      --cp-surface: #1e2e24;
      --cp-surface-soft: #283b2b;
      --cp-border: #3a4d38;
      --cp-border-strong: #7d946c;
      --cp-text: #ecf0db;
      --cp-text-muted: #bec9b0;
      --cp-text-soft: #a4b394;
      --cp-accent: #d7ef89;
      --cp-accent-hover: #e5f6ad;
      --cp-accent-soft: #334827;
      --cp-accent-fg: #263c21;
      --cp-secondary: #e8c895;
      --cp-secondary-soft: #423b27;
      --cp-feature-bg: #2a442e;
      --cp-feature-border: #4b6542;
      --cp-highlight: rgba(215, 239, 137, 0.14);
      --cp-shadow: 0 18px 48px rgba(4, 14, 7, 0.38);
      --cp-overlay: rgba(8, 17, 11, 0.76);
      --cp-danger: #ffaca1;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; background: var(--cp-bg); color: var(--cp-text); font-family: "Segoe UI", Aptos, Calibri, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 15px; line-height: 1.5; transition: background-color 280ms, color 280ms; }
    button, input, textarea { font: inherit; }
    button { cursor: pointer; -webkit-tap-highlight-color: var(--cp-highlight); }
    button:disabled { cursor: default; }
    button, a { touch-action: manipulation; }
    button:focus-visible, a:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--cp-accent); outline-offset: 4px; }
    h1, h2, h3, p { margin: 0; }
    h1, h2, h3 { line-height: 1.15; font-weight: 600; }
    svg { width: 24px; height: 24px; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .icon-library { position: absolute; width: 0; height: 0; overflow: hidden; }
    .skip { position: fixed; top: -80px; left: 16px; z-index: 50; background: var(--cp-surface); color: var(--cp-accent); padding: 12px; }
    .skip:focus { top: 16px; }
    .icon-button { width: 44px; height: 44px; display: inline-grid; place-items: center; border: 1px solid var(--cp-border); border-radius: 10px; background: var(--cp-surface); color: var(--cp-text-muted); }
    .text-button { border: 0; background: none; color: var(--cp-text-muted); min-height: 44px; padding: 8px 12px; border-radius: 10px; font-size: 13px; }
    .text-button:hover, .icon-button:hover { background: var(--cp-accent-soft); color: var(--cp-accent); }
    .app { max-width: 1360px; margin: auto; }
    .app-header { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 28px 48px; }
    .brand { display: flex; align-items: center; gap: 12px; font-size: 25px; font-weight: 700; letter-spacing: -1.1px; }
    .brand-mark { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 12px; background: var(--cp-accent); color: var(--cp-accent-fg); }
    .brand-mark svg { width: 25px; height: 25px; }
    .header-actions { display: flex; align-items: center; gap: 16px; }
    .offline { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--cp-text-muted); }
    .offline svg { width: 16px; height: 16px; }
    .button { position: relative; overflow: hidden; display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 48px; padding: 12px 20px; border: 1px solid var(--cp-border); border-radius: 10px; background: var(--cp-surface); color: var(--cp-text); font-weight: 600; font-size: 14px; transition: transform 250ms cubic-bezier(.2,.8,.2,1), background 200ms, border-color 200ms; }
    .button:hover:not(:disabled) { background: var(--cp-accent-soft); border-color: var(--cp-accent); transform: translateY(-2px); }
    .button:active:not(:disabled) { transform: scale(.975); }
    .button.primary { background: var(--cp-accent); border-color: var(--cp-accent); color: var(--cp-accent-fg); }
    .button.primary:hover { background: var(--cp-accent-hover); border-color: var(--cp-accent-hover); }
    .button.tonal { background: var(--cp-accent-soft); border-color: var(--cp-accent-soft); color: var(--cp-accent); }
    .button svg { width: 19px; height: 19px; }
    .button:disabled { background: var(--cp-surface-soft); border-color: var(--cp-border); color: var(--cp-text-soft); }
    main { padding: 28px 48px 24px; }
    .eyebrow { font-size: 11px; text-transform: uppercase; font-weight: 650; letter-spacing: 1.6px; color: var(--cp-accent); margin-bottom: 16px; }
    .intro { margin-bottom: 32px; }
    .intro h1 { font-size: clamp(36px, 4.2vw, 58px); font-weight: 500; letter-spacing: -2.6px; max-width: 900px; line-height: 1.06; }
    .intro h1 em { font-family: Georgia, "Times New Roman", serif; font-weight: 400; color: var(--cp-accent); letter-spacing: -2px; }
    .intro p { color: var(--cp-text-muted); margin-top: 12px; font-size: 16px; }
    .workspace { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(280px, 1fr); gap: 24px; }
    .panel { background: var(--cp-surface); border: 1px solid var(--cp-border); border-radius: 16px; transition: background-color 280ms, border-color 280ms; }
    .hero, .import-panel {
      --cp-accent: var(--cp-feature-accent);
      --cp-accent-hover: var(--cp-feature-accent-hover);
      --cp-accent-fg: var(--cp-feature-accent-fg);
      --cp-accent-soft: var(--cp-feature-soft);
      --cp-text: var(--cp-feature-text);
      --cp-text-muted: var(--cp-feature-muted);
      --cp-text-soft: var(--cp-feature-muted);
      --cp-border: var(--cp-feature-border);
      --cp-surface: var(--cp-feature-surface);
      --cp-bg-elevated: var(--cp-feature-surface);
      color: var(--cp-text);
      background: var(--cp-feature-bg);
    }
    .import-panel { padding: 28px 32px 32px; text-align: center; min-height: 366px; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
    .import-panel::after { content: ""; position: absolute; inset: 12px; border: 1px solid var(--cp-border); border-radius: 10px; pointer-events: none; }
    .import-art { width: 152px; height: 112px; position: relative; margin-bottom: 20px; }
    .paper { position: absolute; width: 72px; height: 90px; left: 40px; top: 8px; border-radius: 10px; border: 1px solid var(--cp-border); background: var(--cp-bg-elevated); transform: rotate(-17deg) translateX(-17px); }
    .paper.second { transform: rotate(15deg) translateX(17px); background: var(--cp-accent-soft); border-color: var(--cp-accent); }
    .paper.front { display: grid; place-items: center; transform: rotate(-2deg); background: var(--cp-accent); color: var(--cp-accent-fg); box-shadow: 0 2px 3px var(--cp-highlight); }
    .paper.front svg { width: 32px; height: 32px; }
    .spark { position: absolute; color: var(--cp-accent); right: 0; top: 0; }
    .import-panel:hover .paper.second { transform: rotate(22deg) translateX(22px); }
    .import-panel:hover .paper:first-child { transform: rotate(-24deg) translateX(-22px); }
    .paper { transition: transform 500ms cubic-bezier(.2,.8,.2,1); }
    .import-panel h2 { font-size: 25px; letter-spacing: -.6px; }
    .import-panel p { color: var(--cp-text-muted); max-width: 345px; margin-top: 10px; font-size: 14px; }
    .import-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 24px; z-index: 1; }
    .import-note { margin-top: 16px; font-size: 11px; color: var(--cp-text-soft); }
    .bundled-chapter { position: relative; z-index: 1; width: 100%; margin-top: 24px; padding: 20px; border: 1px solid var(--cp-border); border-radius: 12px; text-align: left; }
    .bundled-chapter strong { display: block; font-size: 16px; font-weight: 600; overflow-wrap: anywhere; }
    .bundled-chapter small { display: block; margin: 8px 0 16px; color: var(--cp-text-muted); font-size: 12px; }
    .help-steps { padding-left: 24px; color: var(--cp-text-muted); font-size: 14px; }
    .help-steps li { padding: 8px 0; }
    .section-label { font-size: 12px; font-weight: 600; color: var(--cp-text-muted); display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .section-label span:last-child { font-size: 11px; font-weight: 400; }
    .capabilities { display: flex; flex-direction: column; }
    .mode-card { display: flex; align-items: center; gap: 16px; padding: 22px; border: 1px solid var(--cp-border); background: var(--cp-surface); border-radius: 16px; width: 100%; text-align: left; color: var(--cp-text); transition: background 220ms, border-color 220ms, transform 300ms cubic-bezier(.2,.8,.2,1); }
    .mode-card + .mode-card { margin-top: 12px; }
    .simulator-tile { display: flex; flex-direction: column; min-width: 0; margin-top: 12px; }
    .simulator-tile + .mode-card { margin-top: 12px; }
    .simulator-tile.has-attempt { border: 1px solid var(--cp-border); border-radius: 16px; background: var(--cp-secondary-soft); }
    .simulator-tile > .mode-card { flex: 1; }
    .simulator-tile.has-attempt > .mode-card { border: 0; border-radius: 16px 16px 0 0; }
    .simulator-controls { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 16px; border-top: 1px solid var(--cp-border); }
    .simulator-controls > span { color: var(--cp-text-muted); font-size: 11px; }
    .simulator-controls .text-button { display: inline-flex; align-items: center; gap: 8px; color: var(--cp-secondary); white-space: nowrap; }
    .simulator-controls svg { width: 16px; height: 16px; }
    .mode-card:not(:disabled) { background: var(--cp-accent-soft); }
    .mode-card[data-action="exam"]:not(:disabled) { background: var(--cp-secondary-soft); }
    .mode-card[data-action="exam"]:not(:disabled) .mode-icon { background: var(--cp-surface); color: var(--cp-secondary); }
    .mode-card[data-action="exam"]:not(:disabled) .mode-end { color: var(--cp-secondary); }
    .mode-card:not(:disabled):hover { transform: translateY(-3px); border-color: var(--cp-accent); }
    .mode-icon { width: 44px; height: 44px; border-radius: 12px; background: var(--cp-accent-soft); color: var(--cp-accent); display: grid; place-items: center; flex-shrink: 0; }
    .mode-card:disabled .mode-icon { background: var(--cp-surface-soft); color: var(--cp-text-soft); }
    .mode-copy { flex: 1; min-width: 0; }
    .mode-copy strong { display: block; font-size: 15px; font-weight: 600; }
    .mode-copy small { display: block; color: var(--cp-text-muted); margin-top: 4px; font-size: 12px; line-height: 1.5; }
    .simulator-status { display: inline-flex; padding: 4px 8px; margin-bottom: 8px; border-radius: 8px; background: var(--cp-surface); color: var(--cp-secondary); font-size: 11px; font-weight: 600; }
    .mode-end { color: var(--cp-accent); }
    .mode-card:disabled .mode-end { color: var(--cp-text-soft); width: 17px; }
    .helper { display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--cp-text-soft); font-size: 12px; margin-top: 28px; }
    .helper svg { width: 16px; height: 16px; }
    .app-footer { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin: 40px 48px 24px; padding-top: 20px; border-top: 1px solid var(--cp-border); color: var(--cp-text-soft); font-size: 11px; }
    .app-footer .text-button { min-height: 32px; padding: 4px; font-size: 11px; }
    .pack-banner { display: flex; align-items: center; gap: 16px; padding: 18px 20px; margin-bottom: 24px; }
    .pack-banner > .mode-icon { width: 40px; height: 40px; }
    .pack-name { flex: 1; min-width: 0; }
    .pack-name strong { display: block; font-size: 14px; overflow-wrap: anywhere; }
    .pack-name small { color: var(--cp-text-muted); font-size: 12px; }
    .ready-tag { display: flex; gap: 6px; align-items: center; color: var(--cp-accent); font-size: 11px; font-weight: 600; background: var(--cp-accent-soft); border-radius: 8px; padding: 6px 10px; white-space: nowrap; }
    .ready-tag svg { width: 14px; height: 14px; }
    .hero { padding: 32px; min-height: 300px; border-color: var(--cp-border); position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: flex-start; }
    .hero h2 { font-size: 38px; font-weight: 500; letter-spacing: -1.4px; max-width: 330px; position: relative; }
    .hero p { margin: 16px 0 24px; color: var(--cp-text-muted); max-width: 310px; font-size: 14px; position: relative; }
    .hero .button { margin-top: auto; }
    .hero-orbit { width: 146px; height: 146px; position: absolute; right: 24px; top: 68px; color: var(--cp-accent); opacity: .8; }
    .hero-orbit svg { width: 100%; height: 100%; stroke-width: 1; }
    .hero-meta { display: flex; gap: 16px; color: var(--cp-accent); font-size: 11px; font-weight: 600; margin-bottom: 20px; }
    .topic-panel { margin-top: 24px; padding: 24px; }
    .chapter-focus { margin: 24px 0; }
    .chapter-focus .eyebrow { margin-bottom: 8px; }
    .chapter-focus h2 { font-size: 24px; line-height: 1.3; overflow-wrap: anywhere; }
    .chapter-focus p { font-size: 13px; color: var(--cp-text-muted); margin-top: 8px; }
    .simulator-scope-note { padding: 12px 16px; color: var(--cp-text-muted); font-size: 12px; border-top: 1px solid var(--cp-border); }
    .topic-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
    .topic-heading h2 { font-size: 16px; letter-spacing: -.3px; }
    .topic-heading span { font-size: 11px; color: var(--cp-text-soft); }
    .practice-context { margin-top: 8px; color: var(--cp-text-muted); font-size: 13px; line-height: 1.5; overflow-wrap: anywhere; }
    .practice-context strong { color: var(--cp-text); font-weight: 600; }
    .topics { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
    .topic { min-width: 0; padding: 16px; border: 1px solid var(--cp-border); border-radius: 12px; background: var(--cp-bg-elevated); }
    .topic.is-current { border-color: var(--cp-accent); box-shadow: inset 3px 0 0 var(--cp-accent); }
    .current-chapter-tag { display: inline-flex; align-items: center; gap: 6px; margin-bottom: 12px; padding: 5px 8px; border-radius: 8px; background: var(--cp-accent-soft); color: var(--cp-accent); font-size: 11px; font-weight: 600; }
    .current-chapter-tag svg { width: 14px; height: 14px; }
    .add-chapter-card { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; width: 100%; min-width: 0; min-height: 180px; padding: 24px; border: 1px dashed var(--cp-border-strong); border-radius: 12px; background: var(--cp-bg-elevated); color: var(--cp-accent); text-align: center; transition: background 220ms, border-color 220ms, transform 220ms; }
    .add-chapter-card:hover:not(:disabled) { background: var(--cp-accent-soft); border-color: var(--cp-accent); transform: translateY(-2px); }
    .add-chapter-card:active:not(:disabled) { transform: scale(.98); }
    .add-chapter-card:disabled { color: var(--cp-text-soft); }
    .add-chapter-card strong { font-size: 15px; font-weight: 600; }
    .add-chapter-card small { max-width: 220px; font-size: 12px; color: var(--cp-text-muted); line-height: 1.6; }
    .add-chapter-icon { display: grid; place-items: center; width: 48px; height: 48px; border-radius: 12px; background: var(--cp-accent-soft); }
    .chapter-select { display: block; width: 100%; min-height: 44px; margin-bottom: 12px; padding: 0; border: 0; border-radius: 8px; background: none; color: var(--cp-text); text-align: left; }
    .chapter-select:hover { color: var(--cp-accent); }
    .topic-name { display: flex; gap: 8px; justify-content: space-between; align-items: baseline; font-size: 14px; }
    .topic-name strong { font-weight: 500; overflow-wrap: anywhere; }
    .topic-name span { font-size: 11px; color: var(--cp-text-soft); white-space: nowrap; }
    .progress { height: 5px; border-radius: 8px; background: var(--cp-border); overflow: hidden; }
    .progress > span { height: 100%; display: block; background: var(--cp-accent); border-radius: inherit; transition: width 500ms cubic-bezier(.2,.8,.2,1); }
    .topic > small { display: block; margin-top: 8px; font-size: 10px; color: var(--cp-text-soft); }
    .reveal-in { animation: arrive 600ms cubic-bezier(.2,.8,.2,1) both; }
    .stagger-1 { animation-delay: 70ms; }
    .stagger-2 { animation-delay: 140ms; }
    .stagger-3 { animation-delay: 210ms; }
    @keyframes arrive { from { opacity: 0; transform: translateY(16px) scale(.99); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes answer-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes ripple { to { transform: scale(1); opacity: 0; } }
    .ripple { position: absolute; border-radius: 50%; pointer-events: none; background: var(--cp-sheen); transform: scale(0); animation: ripple 550ms ease-out forwards; }
    .toast { position: fixed; bottom: 28px; left: 50%; transform: translate(-50%, 20px); opacity: 0; pointer-events: none; z-index: 10; background: var(--cp-text); color: var(--cp-surface); padding: 14px 20px; border-radius: 10px; font-size: 13px; max-width: calc(100vw - 32px); width: max-content; transition: transform 280ms, opacity 280ms; }
    .toast.visible { transform: translate(-50%, 0); opacity: 1; }
    .import-error { margin: 0 48px; padding: 16px 20px; border: 1px solid var(--cp-danger); border-radius: 10px; color: var(--cp-danger); background: var(--cp-surface); font-size: 13px; }
    .drop-shield { position: fixed; inset: 16px; background: var(--cp-overlay); border: 2px dashed var(--cp-accent); color: var(--cp-accent); border-radius: 16px; z-index: 20; display: grid; place-content: center; text-align: center; pointer-events: none; }
    .drop-shield svg { width: 56px; height: 56px; margin: 0 auto 24px; }
    .drop-shield strong { font-size: 28px; }
    dialog { color: var(--cp-text); background: var(--cp-bg-elevated); border: 1px solid var(--cp-border); border-radius: 16px; width: min(680px, calc(100vw - 32px)); max-height: calc(100dvh - 48px); padding: 0; box-shadow: var(--cp-shadow); }

  <script>
    "use strict";
    const state = { pack: null, source: "", ratings: new Map(), missed: new Set(), recall: null, chapterRecalls: new Map(), selectedChapter: null, recallSource: "all", cardLibrary: null, cardBatch: null, flashcardReset: null, exam: null, chapterTests: new Map(), chapterPractice: new Map(), practiceView: null, practiceResize: null, activeTest: null, questionResults: new Map(), error: "", importing: false, personalCards: [], storageKey: "", storageError: "", storageDirty: false, savingCards: false, chapter: "", cardEditor: null, deleteCardId: null, sessionKey: "", progressError: "", progressDirty: false, savingProgress: false, progressBlocked: false, restoring: true, restored: false };

    let progressChange = 0;
    let progressWritten = 0;
    let sessionRevision = 0;

    let progressPackWritten = 0;
    let bundledChapters = [];
    const isRecord = value => value !== null && typeof value === "object" && !Array.isArray(value);
    const validText = (value, max) => typeof value === "string" && value.trim().length > 0 && value.length <= max;
    const escapeHTML = value => String(value).replace(/[&<>"']/g, char => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[char]);

    const countLabel = (count, noun) => `${count} ${noun}${count === 1 ? "" : "s"}`;

    const topicGroups = () => {
      const groups = new Map((state.pack.chapterCollection?.chapters ?? []).map(chapter => [chapter.id, []]));
      for (const question of state.pack.questions) {
        if (!groups.has(question.topic)) groups.set(question.topic, []);

        if (!groups.has(card.chapter)) groups.set(card.chapter, []);

    };
    const personalCardsInChapter = chapter => state.personalCards.filter(card => !card.deleted && card.chapter === chapter);

    function recallCards() {
      if (!state.pack) return [];
      const chapterOrder = new Map([...topicGroups().keys()].map((chapter, index) => [chapter, index]));
      return [
        ...state.pack.flashcards.map(card => ({ ...card, mine: false })),
        ...state.personalCards.filter(card => !card.deleted).map(card => ({ ...card, mine: true }))

    }

    function rememberChapterRecall() {
      if (state.recall && state.recall.chapter !== null && !state.recall.review && state.recall.origin === "all") state.chapterRecalls.set(state.recall.chapter, state.recall);

      const current = state.recall?.chapter === state.selectedChapter && state.recall.origin === state.recallSource ? state.recall : state.recallSource === "all" ? state.chapterRecalls.get(state.selectedChapter) : null;

      const selected = new Set(selection);

      if (selected) return { result: "incorrect", label: "Incorrectly selected", glyph: "close" };
      if (expected) return { result: "missed", label: "Missed correct answer", glyph: "arrow" };
      return { result: "neutral", label: "Not selected", glyph: "" };

    function renderExamResults() {
      const exam = state.activeTest;
      if (!exam?.submitted) { notify("Finish the test before reviewing answers."); return; }
      openDialog(`${dialogHeader("A closer look", exam.title)}
        <div class="review-list">${exam.questions.map((question, questionIndex) => {
          const evaluation = evaluateQuestion(question, exam.answers.get(question.id));
          if (exam.chapter !== null) {
            const selection = [...evaluation.selected].map(index => question.options[index]);
            return `<section class="review-item"><p>${questionIndex + 1}. ${escapeHTML(chapterTitle(question.topic))}</p><h3>${escapeHTML(question.prompt)}</h3><p>${selection.length ? `Your selection: ${escapeHTML(selection.join("; "))}` : "You did not answer this question."}</p>${renderPracticeExplanation(question)}</section>`;
          }
          return `<section class="review-item"><p>${questionIndex + 1}. ${escapeHTML(chapterTitle(question.topic))} · ${isSelectAll(question) ? "Select all that apply" : "Single choice"}</p><h3>${escapeHTML(question.prompt)}</h3><p class="review-status">${evaluation.correct ? "Correct · 1 point" : evaluation.selected.size ? "Incorrect · 0 points" : "Unanswered · 0 points"}</p><div class="review-options" role="list" aria-label="Answer choices and feedback">${question.options.map((option, index) => {
            const outcome = choiceOutcome(evaluation, index);
            return `<div class="review-option" role="listitem" data-result="${outcome.result}"><span>${escapeHTML(option)}</span>${renderChoiceFeedback(question, index, outcome)}</div>`;
          }).join("")}</div>${renderQuestionFeedback(question, evaluation)}</section>`;
        }).join("")}</div><div class="dialog-actions">${button(exam.chunkSize !== undefined ? "practice-back" : "close-dialog", exam.chunkSize !== undefined ? "Back to chunks" : "Back to my space", "primary")}</div>`, testAction(exam));
    }
    function downloadJSON(data, filename) {
      const url = URL.createObjectURL(new Blob([JSON.stringify(data)], { type: "application/json" }));
      const link = document.createElement("a");
      link.href = url;
      link.download = filename;
      document.body.append(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }
    function readBundledChapters() {
      try {
        const entries = JSON.parse(document.getElementById("bundled-chapters").textContent);
        if (!Array.isArray(entries)) throw new Error("The included chapter list is invalid.");
        for (const entry of entries) {
          if (!isRecord(entry) || !validText(entry.filename, 255) || entry.pack?.schemaVersion !== 1) throw new Error("An included chapter is invalid.");
          validatePack(entry.pack);
        }
        bundledChapters = entries;
      } catch (error) {
        console.error("Included chapter loading failed:", error);
        state.error = `Could not load the included study material. ${error instanceof Error ? error.message : "Please import its JSON file instead."}`;
      }
    }
    function openBundledChapter(index) {
      const entry = bundledChapters[index];
      if (!Number.isInteger(index) || !entry) { notify("That included chapter is unavailable. Import its JSON file instead."); return; }
      return importFile(new File([JSON.stringify(entry.pack)], entry.filename, { type: "application/json" }));
    }
    function showHelp() {
      openDialog(`${dialogHeader("A chapter at a time.", "A quick guide to your study space")}
        <ol class="help-steps">
          <li>Open an included chapter or import a chapter JSON file.</li>
          <li>Select a chapter to focus its flashcards and practice questions.</li>
          <li>Choose All cards, My cards, or Pack cards for recall and revisit. The chapter library has search and page controls at the top.</li>
          <li>Use Add mine to build a batch. Add each draft to the batch, then press Add N cards to save them together. The editor stays open until you choose Done.</li>
          <li>After finishing a review, Reset chapter flashcards clears that chapter's confidence and review queue, not the cards or test results.</li>
          <li>Use the + Add chapter card to grow your collection without replacing earlier chapters.</li>
          <li>Chapter practice splits questions into chunks of any size you choose. Select a response and use Show explanation; no answer keys or option verdicts are shown in practice.</li>
          <li>The simulator randomly draws up to 150 unique questions from all added chapters. Feedback appears after submission. Closing pauses the timer; Reset test draws a new sample without starting.</li>
          <li>Progress saves in this browser. Use Export backup to keep a separate copy or move to another device. Import that backup to restore it.</li>
        </ol>
        <p class="think-note">If saving is unavailable, the app will warn you. Do not close the app before exporting work you want to keep. This prototype is intended for study; verify the accuracy of generated material against its source.</p>
        <div class="dialog-actions">${button("close-dialog", "Got it", "primary")}</div>`, "help");
    }
    function exportEnrichedPack() {
      const filename = state.pack.title.replace(/[^a-z0-9]+/gi, "-").replace(/^-+|-+$/g, "").slice(0, 100) || "study";
      const backup = { ...state.pack, personalFlashcards: state.personalCards, studyProgress: serializeStudyProgress() };
      if (new Blob([JSON.stringify(backup)]).size > MAX_PACK_BYTES) { notify("This backup exceeds the 32 MB import limit. Reduce the pack size before exporting."); return; }
      downloadJSON(backup, `${filename}-with-my-cards.json`);
      notify("Export requested. Keep the downloaded file as your portable backup.");
    }
    function updateThemeButton() {
      const dark = document.documentElement.dataset.theme === "dark";
      const toggle = document.getElementById("theme-toggle");
      toggle.innerHTML = icon(dark ? "sun" : "moon");
      toggle.setAttribute("aria-label", `Switch to ${dark ? "light" : "dark"} theme`);
    }
    document.addEventListener("click", event => {
      const actionButton = event.target.closest("[data-action]");
      if (!actionButton || actionButton.disabled || state.savingCards) return;
      const action = actionButton.dataset.action;
      if (actionButton.dataset.chapterIndex !== undefined) {
        chapterFocusIndex = Number(actionButton.dataset.chapterIndex);
        state.chapter = [...topicGroups().keys()][chapterFocusIndex];
      }
      switch (action) {
        case "theme":
          document.documentElement.dataset.theme = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
          updateThemeButton();
          break;
        case "help": showHelp(); break;
        case "import": fileInput.click(); break;
        case "open-bundled": openBundledChapter(Number(actionButton.dataset.bundledIndex)); break;
        case "select-chapter": selectChapter(actionButton.dataset.chapterId); break;
        case "recall-source": selectRecallSource(actionButton.dataset.origin); break;
        case "export-pack": exportEnrichedPack(); break;
        case "chapters":
          document.getElementById("topics-title").focus({ preventScroll: true });
          document.getElementById("topics-title").scrollIntoView({ block: "start", behavior: reduceMotion.matches ? "instant" : "smooth" });
          break;
        case "chapter-cards": renderChapterCards(); break;
        case "chapter-test": startChapterTest(); break;
        case "practice-chunk": startPracticeChunk(Number(actionButton.dataset.chunkIndex)); break;
        case "practice-back":
          state.chapter = state.activeTest?.chapter ?? state.practiceView.chapter;
          startChapterTest();
          break;
        case "practice-next-chunk":
          state.practiceView = { chapter: state.activeTest.chapter, page: Math.floor((state.activeTest.chunkIndex + 1) / PRACTICE_PAGE_SIZE) };
          startPracticeChunk(state.activeTest.chunkIndex + 1);
          break;
        case "practice-retry":
          if (window.confirm("Start this chunk again? Its answers and completion status will reset. Other chunks and your flashcards are kept.")) {
            state.practiceView = { chapter: state.activeTest.chapter, page: Math.floor(state.activeTest.chunkIndex / PRACTICE_PAGE_SIZE) };
            startPracticeChunk(state.activeTest.chunkIndex, true);
          }
          break;
        case "practice-page-back": state.practiceView.page--; renderPracticePlan(); break;
        case "practice-page-next": state.practiceView.page++; renderPracticePlan(); break;
        case "practice-size-cancel": renderPracticePlan(); break;
        case "practice-size-confirm":
          if (state.practiceResize) setPracticeSize(state.practiceResize.chapter, state.practiceResize.size);
          break;
        case "card-add": openCardEditor(); break;
        case "card-edit": openCardEditor(actionButton.dataset.cardId); break;
        case "card-delete": requestDeleteCard(actionButton.dataset.cardId); break;
        case "card-delete-confirm": deletePersonalCard(); break;
        case "batch-remove": {
          const index = Number(actionButton.dataset.batchIndex);
          if (state.cardBatch && Number.isInteger(index) && index >= 0 && index < state.cardBatch.items.length) {
            state.cardBatch.items.splice(index, 1);
            renderCardBatch();
            document.getElementById("batch-count").focus({ preventScroll: true });
          }
          break;
        }
        case "batch-commit": commitCardBatch(); break;
        case "library-source":
          if (["all", "mine", "pack"].includes(actionButton.dataset.origin)) {
            state.cardLibrary.source = actionButton.dataset.origin;
            state.cardLibrary.page = 0;
            renderLibraryResults();
          }
          break;
        case "library-previous": changeLibraryPage(-1); break;
        case "library-next": changeLibraryPage(1); break;
        case "flashcards-reset": requestFlashcardReset(actionButton.dataset.chapterId ?? state.chapter, actionButton.dataset.resetOrigin === "review"); break;
        case "flashcards-reset-confirm": resetChapterFlashcards(); break;
        case "flashcards-reset-cancel":
          if (state.flashcardReset?.returnToReview) { state.flashcardReset = null; renderRecallSummary(); }
          else renderChapterCards();
          break;
        case "cards-back": if (allowEditorClose()) renderChapterCards(); break;
        case "cards-practice": startCardPractice(actionButton.dataset.origin); break;
        case "reset": closePack(); break;
        case "recall": startRecall(); break;
        case "resume-recall":
          if (selectedRecall()) {
            state.recall = selectedRecall();
            if (state.recall.chapter !== null) {
              state.chapter = state.recall.chapter;
              chapterFocusIndex = [...topicGroups().keys()].indexOf(state.chapter);
            }
            renderRecall();
          }
          break;
        case "review": startRecall(true); break;
        case "reveal": state.recall.revealed = true; markStudyChanged(); renderRecall(); break;
        case "rate-missed": rateRecall("missed"); break;
        case "rate-unsure": rateRecall("unsure"); break;
        case "rate-knew": rateRecall("knew"); break;
        case "exam": startExam(); break;
        case "exam-pause": closeStudyDialog(); break;
        case "exam-reset": requestSimulatorReset(); break;
        case "exam-reset-confirm": resetSimulator(); break;
        case "exam-reset-cancel":
          if (simulatorResetPending) closeStudyDialog();
          break;
        case "saved-exam-results": if (state.exam?.submitted) renderExamSummary(state.exam); break;
        case "chapter-results": {
          const test = state.chapterTests.get(state.chapter);
          if (test?.submitted) renderExamSummary(test);
          break;
        }
        case "exam-back": if (state.activeTest.index > 0) { state.activeTest.index--; markStudyChanged(); renderExam(); } break;
        case "exam-next": if (state.activeTest.index < state.activeTest.questions.length - 1) { state.activeTest.index++; markStudyChanged(); renderExam(); } break;
        case "exam-check": checkCurrentAnswer(); break;
        case "exam-finish": requestFinish(); break;
        case "exam-return": renderExam(); break;
        case "exam-submit": submitExam(testExpired(state.activeTest)); break;
        case "exam-results": renderExamResults(); break;
        case "close-dialog": closeStudyDialog(); break;
      }
    });
    document.addEventListener("pointerdown", event => {
      const target = event.target.closest(".button");
      if (!target || target.disabled || reduceMotion.matches) return;
      const bounds = target.getBoundingClientRect();
      const size = Math.max(bounds.width, bounds.height) * 2;
      const ripple = document.createElement("span");
      ripple.className = "ripple";
      ripple.style.width = ripple.style.height = `${size}px`;
      ripple.style.left = `${event.clientX - bounds.left - size / 2}px`;
      ripple.style.top = `${event.clientY - bounds.top - size / 2}px`;
      target.append(ripple);
      ripple.addEventListener("animationend", () => ripple.remove(), { once: true });
    });
    dialog.addEventListener("change", event => {
      const test = state.activeTest;
      if (event.target.name !== "exam-answer" || !test || test.submitted) return;
      if (testExpired(test)) { submitExam(true); return; }
      const question = test.questions[test.index];
      if (test.checked.has(question.id)) return;
      const index = Number(event.target.value);
      const selection = new Set(isSelectAll(question) ? test.answers.get(question.id) ?? [] : []);
      if (event.target.checked) selection.add(index);
      else selection.delete(index);
      if (selection.size) test.answers.set(question.id, [...selection].sort((left, right) => left - right));
      else test.answers.delete(question.id);
      markStudyChanged();
      const progress = dialog.querySelector('[role="progressbar"]');
      progress.setAttribute("aria-valuenow", String(test.answers.size));
      progress.firstElementChild.style.width = `${test.answers.size / test.questions.length * 100}%`;
      document.getElementById("selected-count").textContent = `${selection.size} selected`;
      const checkButton = dialog.querySelector('[data-action="exam-check"]');
      if (checkButton) checkButton.disabled = selection.size === 0;
      const nextButton = dialog.querySelector('[data-action="exam-next"], [data-action="exam-finish"]');
      nextButton.disabled = needsAnswerCheck(test, question);
    });
    dialog.addEventListener("input", event => {
      if (event.target.id === "library-search" && state.cardLibrary) {
        state.cardLibrary.query = event.target.value;
        state.cardLibrary.page = 0;
        renderLibraryResults();
        return;
      }
      if (!state.cardEditor || !event.target.matches("#card-front, #card-back")) return;
      state.cardEditor[event.target.name] = event.target.value;
      updateBatchControls();
    });
    dialog.addEventListener("submit", event => {
      if (event.target.id === "card-form") saveCardForm(event);
      else if (event.target.id === "practice-plan-form") applyPracticeSize(event);
    });
    dialog.addEventListener("cancel", event => {
      event.preventDefault();
      closeStudyDialog();
    });
    dialog.addEventListener("close", () => {
      if (dialog.open) return;
      if (lastFocusAction === "exam") pauseSimulation();
      simulatorResetPending = false;
      if (state.exam?.summaryPending) { renderExamSummary(state.exam); return; }
      studyDialogOpen = false;
      if (homeRefreshPending) {
        const { scrollX, scrollY } = window;
        renderHome();
        window.scrollTo({ left: scrollX, top: scrollY, behavior: "instant" });
      }
      const chapterButton = lastFocusAction === "chapter-cards" || lastFocusAction === "chapter-test" ? app.querySelector(`.topic[data-chapter-index="${chapterFocusIndex}"] [data-action="${lastFocusAction}"]`) : null;
      const resetStartButton = lastFocusAction === "exam-reset" && !state.exam?.started ? app.querySelector('.simulator-tile [data-action="exam"]') : null;
      const focusTarget = chapterButton ?? resetStartButton ?? app.querySelector(`[data-action="${lastFocusAction}"]:not(:disabled)`) ?? document.getElementById("page-title");
      focusTarget?.focus({ preventScroll: true });
    });
    window.addEventListener("beforeunload", event => {
      if (state.storageDirty || state.savingCards || (state.pack && state.progressDirty) || state.savingProgress || editorHasChanges()) {
        event.preventDefault();
        event.returnValue = "";
      }
    });
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden && state.exam && !state.exam.submitted) updateTimer();
      if (document.hidden && state.pack) { markStudyChanged(); saveStudyProgress(); }
    });
    window.addEventListener("pagehide", () => { pauseSimulation(); saveStudyProgress(); });
    window.addEventListener("pageshow", event => {
      if (!event.persisted) return;
      if (dialog.open && lastFocusAction === "exam" && state.activeTest === state.exam) renderExam();
      else renderHome();
    });
    fileInput.addEventListener("change", () => importFile(fileInput.files[0]));
    let dragDepth = 0;
    const shield = document.getElementById("drop-shield");
    document.addEventListener("dragenter", event => {
      if (!event.dataTransfer.types.includes("Files")) return;
      event.preventDefault();
      dragDepth++;
      if (!dialog.open && !state.importing) shield.hidden = false;
    });
    document.addEventListener("dragleave", () => {
      dragDepth = Math.max(0, dragDepth - 1);
      if (!dragDepth) shield.hidden = true;
    });
    document.addEventListener("dragover", event => { if (event.dataTransfer.types.includes("Files")) event.preventDefault(); });
    document.addEventListener("drop", event => {
      if (!event.dataTransfer.types.includes("Files")) return;
      event.preventDefault();
      dragDepth = 0; shield.hidden = true;
      if (event.dataTransfer.files.length !== 1) { notify("Please open one study pack at a time."); return; }
      importFile(event.dataTransfer.files[0]);
    });
    readBundledChapters();
    renderHome();
    restoreLastStudySession();
  </script>
</body>
</html>
